name: Daily Price Check

on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 08:00 Israel time (UTC+2)
  workflow_dispatch:       # Allow manual trigger from GitHub

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up server
        run: |
          echo "Waking up server..."
          curl "${{ secrets.BACKEND_URL }}/" --max-time 60 --silent --retry 3 --retry-delay 10 || true
          sleep 10

      - name: Trigger price check
        run: |
          echo "Triggering supermarket price check..."
          curl -X POST "${{ secrets.BACKEND_URL }}/run" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            --silent
          echo "Done! Check your Telegram in a few minutes."
